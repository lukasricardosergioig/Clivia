<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clivia — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --cream: #F5F2EE;
  --cream-dark: #EDE8E2;
  --copper-dark: #2E2218;
  --copper-mid: #5C3520;
  --copper: #7A6655;
  --copper-light: #B8A898;
  --white: #FFFFFF;
  --text: #2E2218;
  --text-muted: #7A6655;
  --border: rgba(122,102,85,0.2);
  --error: #C0392B;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Particle canvas */
#pc {
  position: fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  pointer-events: none;
  z-index: 0;
}

.login-wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 440px;
  padding: 20px;
  animation: fadeUp 0.6s ease both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

.login-card {
  background: var(--white);
  border-radius: 24px;
  border: 1px solid var(--border);
  padding: 48px 44px;
}

.login-logo {
  text-align: center;
  margin-bottom: 32px;
}

.logo-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
}

.logo-mark svg {
  width: 48px;
  height: 48px;
}

.logo-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--copper-dark);
}

.login-title {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--copper-dark);
  text-align: center;
  margin-bottom: 6px;
}

.login-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 32px;
}

/* Google button */
.btn-google {
  width: 100%;
  padding: 13px 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--white);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 20px;
}

.btn-google:hover {
  background: var(--cream);
  border-color: var(--copper-light);
}

.google-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

.divider-text {
  font-size: 12px;
  color: var(--copper-light);
  white-space: nowrap;
}

/* Form */
.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 7px;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: all 0.2s;
}

.form-input:focus {
  border-color: var(--copper);
  background: var(--white);
  box-shadow: 0 0 0 3px rgba(122,102,85,0.1);
}

.form-input::placeholder {
  color: var(--copper-light);
}

.form-input.error {
  border-color: var(--error);
}

.form-error {
  font-size: 12px;
  color: var(--error);
  margin-top: 5px;
  display: none;
}

.forgot-link {
  display: block;
  text-align: right;
  font-size: 12px;
  color: var(--copper);
  text-decoration: none;
  margin-top: -8px;
  margin-bottom: 24px;
  transition: color 0.2s;
}

.forgot-link:hover { color: var(--copper-dark); }

/* Submit button */
.btn-submit {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--copper-dark);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.btn-submit:hover {
  background: var(--copper-mid);
  transform: translateY(-1px);
}

.btn-submit:active {
  transform: translateY(0);
}

/* Register link */
.register-link {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
  color: var(--text-muted);
}

.register-link a {
  color: var(--copper-dark);
  font-weight: 500;
  text-decoration: none;
}

.register-link a:hover {
  text-decoration: underline;
}

/* Password toggle */
.input-wrapper {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--copper-light);
  padding: 0;
  font-size: 16px;
  transition: color 0.2s;
}

.toggle-password:hover { color: var(--copper); }

@media (max-width: 480px) {
  .login-card { padding: 36px 28px; }
}
</style>
</head>
<body>

<canvas id="pc"></canvas>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(24,24)">
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(0)"/>
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(60)"/>
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(120)"/>
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(180)"/>
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(240)"/>
            <rect x="-6" y="-15" width="12" height="16" rx="6" fill="#7A6655" transform="rotate(300)"/>
          </g>
        </svg>
      </div>
      <div class="logo-name">CLIVIA</div>
    </div>

    <h1 class="login-title">Bem-vinda de volta</h1>
    <p class="login-subtitle">Entre na sua conta para continuar</p>

    <!-- Google -->
    <button class="btn-google" onclick="loginGoogle()">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continuar com Google
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">ou entre com email</span>
      <div class="divider-line"></div>
    </div>

    <!-- Form -->
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-input" id="email" type="email" placeholder="seu@email.com" autocomplete="email">
        <span class="form-error" id="email-error">E-mail inválido</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Senha</label>
        <div class="input-wrapper">
          <input class="form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px;">
          <button type="button" class="toggle-password" onclick="togglePwd()" id="pwd-toggle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="form-error" id="pass-error">Senha incorreta</span>
      </div>

      <a href="#" class="forgot-link">Esqueceu a senha?</a>

      <button type="submit" class="btn-submit" id="submit-btn">Entrar</button>
    </form>

    <p class="register-link">
      Ainda não tem conta? <a href="clivia-register.html">Criar conta</a>
    </p>

  </div>
</div>

<script>
// Particle background
(function(){
  var cv = document.getElementById('pc');
  var ctx = cv.getContext('2d');
  function resize(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  var p=[];
  for(var i=0;i<42;i++){
    p.push({
      x:Math.random()*cv.width, y:Math.random()*cv.height,
      r:0.8+Math.random()*1.8,
      vx:(Math.random()-0.5)*0.35, vy:(Math.random()-0.5)*0.2,
      a:0.07+Math.random()*0.18,
      pulse:Math.random()*Math.PI*2, ps:0.007+Math.random()*0.01,
      wx:Math.random()*Math.PI*2, wy:Math.random()*Math.PI*2,
      ws:0.003+Math.random()*0.005
    });
  }
  function draw(){
    var W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    p.forEach(function(pt){
      pt.pulse+=pt.ps; pt.wx+=pt.ws; pt.wy+=pt.ws*0.7;
      pt.x+=pt.vx+Math.sin(pt.wx)*0.3;
      pt.y+=pt.vy+Math.cos(pt.wy)*0.18;
      if(pt.x<-10)pt.x=W+10; if(pt.x>W+10)pt.x=-10;
      if(pt.y<-10)pt.y=H+10; if(pt.y>H+10)pt.y=-10;
      var a=pt.a*(0.5+0.5*Math.sin(pt.pulse));
      ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2);
      ctx.fillStyle='rgba(101,67,40,'+a+')'; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function togglePwd(){
  var input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function handleLogin(e){
  e.preventDefault();
  var email = document.getElementById('email').value;
  var pass = document.getElementById('password').value;
  var valid = true;

  document.getElementById('email').classList.remove('error');
  document.getElementById('password').classList.remove('error');
  document.getElementById('email-error').style.display = 'none';
  document.getElementById('pass-error').style.display = 'none';

  if(!email || !email.includes('@')){
    document.getElementById('email').classList.add('error');
    document.getElementById('email-error').style.display = 'block';
    valid = false;
  }
  if(!pass || pass.length < 6){
    document.getElementById('password').classList.add('error');
    document.getElementById('pass-error').style.display = 'block';
    valid = false;
  }

  if(valid){
    var btn = document.getElementById('submit-btn');
    btn.textContent = 'Entrando...';
    btn.disabled = true;
    // Aqui vai a integração com Supabase
    setTimeout(function(){ btn.textContent = 'Entrar'; btn.disabled = false; }, 2000);
  }
}

function loginGoogle(){
  // Aqui vai a integração com Supabase Google OAuth
  alert('Integração com Google via Supabase em breve!');
}
</script>
</body>
</html>
